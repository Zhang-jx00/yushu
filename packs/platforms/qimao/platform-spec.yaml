# 七猫中文网·平台规则包（T5-8「平台规则包首轮填充」的第一片，R177）
#
# **这个包里的每一条规则都能指回公开规则页**：每条规则的 source 里带 URL 与条款定位，
# 顶层 source_urls 是核过的官方页面清单。核不到出处的条款**不写进来**——
# 宁可这个包只有三条，也不写一套编出来的规则。
#
# 核对的结论与日期（台账 docs/09 / 交接文档 §2 有同一份记录）：
# - 核对日期：**2026-10-25**（下面每条规则的 source 都是那天的实读）
# - 来源：七猫官方「作家签约政策 / 投稿指南」`https://www.qimao.com/fuli/`
#   （页面自述「最近更新：2025年2月1日」⇒ 本包的 effective_date 取该日，**不是查到的精确日期**）
# - 核对方式：直接抓取该页正文，逐条比对下列原文；页面上没有的数字一律不写。
#
# 字段键（daily-words.floor / apply-words.floor / no-studio-submission）与口径名、单位
# 由引擎侧的平台口径登记表给定（`PLATFORM_SPEC_FIELDS`）——**口径表是唯一出处**，
# 包里只引用不私造：这样同一个字段在所有平台包里指的是同一件事，跨包对不上时能当场报出来。
#
# **没有写进来的（核不到或不属于本包职责）**：
# - 单章字数上下限：七猫官方页面没有给出单章字数门槛 ⇒ 不写（不拿别的平台的数字来填）。
# - 分类映射 / 审核要点 / AI 使用政策：官方页面未公开成文条款 ⇒ 不写。
# - 投稿材料清单：在同目录的 platform-export.yaml 里（那是导出层要用的清单，不是规则本体）。
platform: qimao
version: "1.0.0"
effective_date: 2025-02-01
checked_at: 2026-10-25
source_urls:
  # 作家签约政策 / 投稿指南（规则本体来源）
  - https://www.qimao.com/fuli/
rules:
  # 每日更新字数下限：官方三张全勤奖表都写「日更≥4000字」或「日更4000（含）~6000字」
  - id: qimao.daily-words.floor
    field: daily-words.floor
    title: 每日更新字数下限
    value: 4000
    unit: 字/日
    meaning: 每日更新字数下限（全勤奖口径）
    source: "https://www.qimao.com/fuli/ —— 全勤奖·保底全勤奖表：「日更4000（含）~6000字」「日更6000字（含）以上」；纯分成阶梯全勤奖：「日更要求：1、日更≥4000字」；超级纯分成：「1、日更≥4000字」"
    effective_from: 2025-02-01
  # 申请签约评估的字数门槛：投稿说明明写「需发文满2万字后才可申请签约评估」，
  # 投稿要求也写「开篇两万字正文+大纲+投稿申请表」
  - id: qimao.apply-words.floor
    field: apply-words.floor
    title: 申请签约评估字数门槛
    value: 20000
    unit: 字/书
    meaning: 申请签约时正文须达到的字数门槛
    source: "https://www.qimao.com/fuli/ —— 投稿说明表：「直接注册发文投稿…需发文满2万字后才可申请签约评估」；投稿要求：「开篇两万字正文+大纲+投稿申请表」"
    effective_from: 2025-02-01
  # 禁止工作室投稿：签约及分成模式一节的原文条款
  - id: qimao.no-studio-submission
    field: no-studio-submission
    title: 禁止工作室投稿
    value: 七猫严禁“工作室”投稿，一经发现，立即解除协议、追回稿费、要求赔偿并追究法律责任！（工作室定义：写同一本书的不止一个作者）
    unit: 条
    meaning: 禁止的工作室投稿条款
    source: "https://www.qimao.com/fuli/ —— 签约及分成模式：「七猫严禁『工作室』投稿，一经发现，立即解除协议、追回稿费、要求赔偿并追究法律责任！」（工作室定义：写同一本书的不止一个作者）"
    effective_from: 2025-02-01
