# 番茄小说·发布口径（M5/T5-6 第 105 轮；T5-8 平台规则包的**第一片**：字数口径）
#
# 这一片只放**发布状态机能判的字段**（I01 §5 的 chapter-word-floor 与当日全勤档）。
# 分类映射 / 审核要点 / AI 使用政策属于 T5-8 的其余几片，等出处核齐再填——
# 一次填一半的包里，那一半是能用的一半，另一半是看不见的一半。
#
# 每个数字都要能在下面的来源里找到出处；找不到出处的字段一律**不填**，
# 而不是借用别的平台的数字（I07 §3.1：平台规则外置、带来源与生效日期、应用只读不硬编码）。
#
# 两条"不填"都是有出处的，不是省事：
# - **单章下限不填**：番茄作家专区课程明写「章节结构优先，字数并不在优先考虑的范围」
#   ⇒ 番茄不设单章字数门槛。拿 VIP 章节 3000 字的下限去要求番茄作者，
#   那是**从别的平台借来的数字**（I01 §2.1 的 3000/1000/2 万是访谈里的通用口径，不是番茄规则）。
# - **有效字数只给口径名**：番茄的"有效更新字数"是「后台打卡口径（自然月内每日有效过审字数）」，
#   以平台后台打卡日历显示为准 ⇒ 本地算不了，也不该拿本地字数冒充。
#   御书因此只报口径名，并由界面把"本地字数"与"平台有效字数"分两栏说清。
#
# 生效日期：来源给到的是「2026 全勤规则」（I08 §3.2 引 fanqienovel.com/welfare），
# 只到年份 ⇒ 这里取该年度起点 2026-01-01，**不是查到的精确日期**。
