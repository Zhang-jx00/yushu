apiVersion: yushu.rules/v1
id: realm-progress
title: 境界推进校验
source: D07-升级节点与爆点设计
rules:
  - id: realm-gap-too-large
    severity: warn
    scope: cross_chapter
    when: {">": [{var: "realm.tier_delta"}, 2]}
    message: "两章之间跨级过大（{realm.from}→{realm.to}），建议补过渡事件与修炼段落"
  - id: realm-lifespan-missing
    severity: info
    scope: project
    when: {"==": [{var: "realm.lifespan_defined"}, false]}
    message: "存在未标注寿元的境界；寿命驱动是玄幻张力的重要来源（仙侠/凡人流尤甚）"
  - id: realm-breakthrough-uncelebrated
    severity: info
    scope: chapter
    when:
      and:
        - {"==": [{var: "chapter.has_breakthrough"}, true]}
        - {"==": [{var: "chapter.has_breakthrough_beat"}, false]}
    message: "本章发生突破但缺少爆点节拍（升级→验证→反馈），建议参考 beats/upgrade-cycle"